<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080E" />
      <stop offset="55%" stop-color="#110C1D" />
      <stop offset="100%" stop-color="#1A0B24" />
    </linearGradient>
    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F5D0FE" />
      <stop offset="100%" stop-color="#FF2A85" />
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#B388FF" />
    </linearGradient>
    <radialGradient id="magentaOrb" cx="82%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#FF007F" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FF007F" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violetOrb" cx="15%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="16" fill="url(#cyberGrid)" />
  <rect width="1200" height="320" rx="16" fill="url(#magentaOrb)" />
  <rect width="1200" height="320" rx="16" fill="url(#violetOrb)" />
  <rect x="1.5" y="1.5" width="1197" height="317" rx="15" fill="none" stroke="url(#borderGlow)" stroke-width="2" stroke-opacity="0.7" />

  
  <g transform="translate(1010, 160)" opacity="0.55">
    <circle cx="0" cy="0" r="105" fill="none" stroke="#FF007F" stroke-width="1" stroke-dasharray="6 6">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="36s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="76" fill="none" stroke="#B388FF" stroke-width="1.2" stroke-dasharray="18 8">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="24s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#FF2A85" stroke-width="1.5" />
    <circle cx="0" cy="0" r="6" fill="#FF007F">
      <animate attributeName="r" values="5;8;5" dur="3s" repeatCount="indefinite" />
    </circle>
    <line x1="-125" y1="0" x2="-85" y2="0" stroke="#B388FF" stroke-width="1" />
    <line x1="85" y1="0" x2="125" y2="0" stroke="#FF007F" stroke-width="1" />
    <line x1="0" y1="-125" x2="0" y2="-85" stroke="#B388FF" stroke-width="1" />
    <line x1="0" y1="85" x2="0" y2="125" stroke="#FF007F" stroke-width="1" />
  </g>

  
  <g font-family="&#39;SFMono-Regular&#39;, Consolas, &#39;Liberation Mono&#39;, Menlo, monospace" font-size="12" letter-spacing="2">
    <circle cx="56" cy="48" r="5" fill="#FF007F">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="72" y="52" fill="#B388FF">PORTFOLIO.SYS // V2026.11</text>
    <text x="1144" y="52" fill="#94A3B8" text-anchor="end">PUNE, INDIA • FULL-STACK ARCHITECTURE</text>
  </g>

  
  <text x="52" y="148" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="4" fill="url(#neonText)">
    NEHA LAKHDIVE
  </text>

  <text x="54" y="192" font-family="&#39;SFMono-Regular&#39;, Consolas, Menlo, monospace" font-size="18" font-weight="600" letter-spacing="2.5" fill="#FF2A85">
    SOFTWARE DEVELOPER  //  FULL-STACK ENGINEER  //  WOMEN IN TECH
  </text>

  <text x="54" y="232" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="16" fill="#CBD5E1">
    Engineering resilient full-stack web platforms, automated testing pipelines, and applied computer vision systems.
  </text>

  
  <line x1="54" y1="272" x2="340" y2="272" stroke="url(#borderGlow)" stroke-width="3" stroke-linecap="round" />
  <text x="356" y="276" font-family="&#39;SFMono-Regular&#39;, Consolas, Menlo, monospace" font-size="11" letter-spacing="1.5" fill="#94A3B8">
    REACT • TYPESCRIPT • PYTHON • DJANGO • AWS
  </text>
</svg>