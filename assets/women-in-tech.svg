      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <rect width="1200" height="220" rx="14" fill="url(#witBg)" stroke="#3B1D54" stroke-width="1.5" />
  <rect x="0" y="0" width="8" height="220" rx="4" fill="url(#witAccent)" />

  
  <g transform="translate(1035, 110)" opacity="0.75">
    <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36" fill="none" stroke="#FF2A85" stroke-width="1.5" />
    <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" fill="none" stroke="#B388FF" stroke-width="1.2" />
    <line x1="-62" y1="-36" x2="62" y2="36" stroke="#7C3AED" stroke-width="1" />
    <line x1="62" y1="-36" x2="-62" y2="36" stroke="#7C3AED" stroke-width="1" />
    <circle cx="0" cy="0" r="8" fill="#FF007F" />
  </g>

  <text x="44" y="48" font-family="&#39;SFMono-Regular&#39;, Consolas, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="2.5" fill="#FF2A85">
    WOMEN IN TECHNOLOGY // PERSPECTIVE
  </text>

  <text x="44" y="90" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">
