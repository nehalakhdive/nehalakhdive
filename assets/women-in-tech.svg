  <text x="44" y="184" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="15.5" fill="#CBD5E1">
    and expanding space for more women to lead, architect, and innovate across the software engineering ecosystem.
  </text>
