<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 44" width="100%" height="44">
  <style>
    .line {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 700;
      fill: #FF1493;
      text-anchor: middle;
      opacity: 0;
    }
    .l1 { animation: cycle 16s infinite 0s; }
    .l2 { animation: cycle 16s infinite 4s; }
    .l3 { animation: cycle 16s infinite 8s; }
    .l4 { animation: cycle 16s infinite 12s; }

    @keyframes cycle {
      0% { opacity: 0; transform: translateY(6px); }
      4%, 21% { opacity: 1; transform: translateY(0); }
      25%, 100% { opacity: 0; transform: translateY(-6px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .l1 { opacity: 1; animation: none; }
    }
  </style>

  <text x="50%" y="29" class="line l1">&gt; dream it  •  &gt; code it  •  &gt; git it girl 💻✨</text>
  <text x="50%" y="29" class="line l2">🎀 I'm just a girl... shipping 630+ passing tests 🎀</text>
  <text x="50%" y="29" class="line l3">Full-Stack Developer | React, TypeScript, Python &amp; Django 🌸</text>
  <text x="50%" y="29" class="line l4">Making backend architecture cute, fast &amp; resilient 🚀</text>
</svg>
